# ============================================
# Campus Intelligence Hub — Docker Compose
# 一条命令：docker compose up -d --build
# 打开 http://localhost:3000
# ============================================

services:
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: campus-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=campus_hub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - campus-network
    command: postgres -c max_connections=1024
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: campus-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - campus-network
    healthcheck:
      test:
        - CMD
        - bash
        - -lc
        - >-
          exec 3<>/dev/tcp/localhost/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3;
          timeout 5 grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 5

  scrapling-service:
    build:
      context: ./scrapling-service
      dockerfile: Dockerfile
    container_name: campus-scrapling
    restart: unless-stopped
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/campus_hub
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-}
      - SECRET_KEY_FILE=/app/data/.secret_key
      - DEFAULT_AGENT_ID=${DEFAULT_AGENT_ID:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ENCRYPTION_KEY_FILE=/app/data/.encryption_key
      - ALLOWED_ORIGINS=*
      - ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - ALLOWED_HEADERS=Content-Type,Authorization,X-Requested-With,Accept
      - LOG_LEVEL=INFO
      - SCRAPLING_SERVICE_URL=http://scrapling-service:8001
      # 构建标识（A2）：与前端构建参数同源，供 GET /api/v1/version 返回与前端比对
      - APP_BUILD=${APP_BUILD:-}
      - APP_VERSION=${APP_VERSION:-2.2.0}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-development}
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      scrapling-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      args:
        BACKEND_PROXY_TARGET: http://backend:8000
        # 构建标识（A2）：与后端 APP_BUILD 同一个值，前端写入 NEXT_PUBLIC_BUILD_ID
        APP_BUILD: ${APP_BUILD:-}
        APP_VERSION: ${APP_VERSION:-2.2.0}
        APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
    container_name: campus-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8000
      - NEXT_PUBLIC_API_BASE_URL=
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-network

networks:
  campus-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  backend-data:
  qdrant-data:
